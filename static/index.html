<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Healthcare Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>Healthcare Assistant</h1>
      <p class="subtitle">Ask me anything about healthcare</p>
    </header>

    <div id="messages" class="messages">
      <div class="message bot">
        Hi! I'm your Healthcare assistant. How can I help you today?
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button type="button">What are common symptoms of the flu?</button>\n      <button type="button">How do I book a doctor appointment?</button>\n      <button type="button">What does my health insurance usually cover?</button>
    </div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
